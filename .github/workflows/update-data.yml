name: Actualitza dades de l'agenda

on:
  schedule:
    # Cada dia a les 05:00 UTC (≈ 06:00/07:00 hora de Catalunya segons l'horari d'estiu/hivern)
    - cron: "0 5 * * *"
  workflow_dispatch: {}   # permet llançar-ho manualment des de la pestanya "Actions"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clona el repositori
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Descarrega i genera data.json
        run: python3 scripts/update_data.py

      - name: Publica el canvi si hi ha dades noves
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "Sense canvis a data.json"
          else
            git add data.json
            git commit -m "Actualitza agenda ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
